<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 p5.js 작품</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0f0f1a;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 2.2rem; color: #c084fc; letter-spacing: 3px; margin-bottom: 10px; }
    header p { font-size: 1rem; color: #aaa; }
    #projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 700px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
    }
    .cell {
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      border: 2px solid #7c3aed;
      box-shadow: 0 0 16px rgba(124, 58, 237, 0.35);
      background: #000;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover .cell {
      border-color: #c084fc;
      box-shadow: 0 0 24px rgba(192, 132, 252, 0.6);
    }
    .cell iframe {
      position: absolute;
      top: 0; left: 0;
      width: 600px;
      height: 400px;
      border: none;
      transform-origin: top left;
      transform: scale(0.5);
      pointer-events: none;
    }
    .label {
      text-align: center;
      font-size: 0.85rem;
      color: #c084fc;
      letter-spacing: 1px;
    }
    footer { margin-top: 48px; font-size: 0.8rem; color: #555; }
  </style>
</head>
<body>
  <header>
    <h1>🎨 나의 p5.js 작품</h1>
    <p>아래에서 다양한 p5.js 작품을 감상하세요.</p>
  </header>
  <main id="projects">
    <a class="card" href="sample1/index.html" target="_blank">
      <div class="cell">
        <iframe src="sample1/index.html"></iframe>
      </div>
      <p class="label">과제 1 · 추상화 그리기</p>
    </a>
    <a class="card" href="sample4/index.html" target="_blank">
      <div class="cell">
        <iframe src="sample4/index.html"></iframe>
      </div>
      <p class="label">과제 4 · 움직이는 추상화</p>
    </a>
    <a class="card" href="sample2/index.html" target="_blank">
      <div class="cell">
        <iframe src="sample2/index.html"></iframe>
      </div>
      <p class="label">과제 2 · 캐릭터 그리기</p>
    </a>
    <a class="card" href="sample3/index.html" target="_blank">
      <div class="cell">
        <iframe src="sample3/index.html"></iframe>
      </div>
      <p class="label">과제 3 · 움직이는 캐릭터</p>
    </a>
  </main>
  <footer>made with p5.js</footer>
</body>
</html>
